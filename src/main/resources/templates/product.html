<!doctype html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<body>

<div layout:fragment="content">

    <div class="container mt-5">
        <div class="card shadow-lg border-0 rounded-4 p-4">

            <h1 class="mb-3 fw-bold" th:text="${product.naam}"></h1>

            <p class="text-muted fs-5" th:text="${product.beschrijving}"></p>

            <div class="my-4">
                <h3 class="fw-semibold">
                    Prijs:
                    <span class="text-success">
                        €<span th:text="${product.afgekortePrijs}"></span>
                    </span>
                </h3>
            </div>

            <p class="fs-5">
                Voorraad:
                <strong class="text-primary" th:text="${stock}">0</strong> stuks
            </p>
            <div class="mt-4">
                <h4 class="fw-semibold mb-3">Batch:</h4>

                <table class="table table-bordered table-striped align-middle">
                    <thead class="table-gray">
                    <tr>
                        <th>Leverdatum</th>
                        <th>Vervaldatum</th>
                        <th>Status</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="vp : ${voorraadLijst}">

                        <td th:text="${#dates.format(
                vp.voorraad.houdbaarheid.leverdatum,
                'dd-MM-yyyy')}">
                        </td>

                        <td th:text="${#dates.format(
                vp.voorraad.houdbaarheid.vervaldatum,
                'dd-MM-yyyy')}">
                        </td>

                        <td>
                <span th:if="${vp.voorraad.houdbaarheid.isverlopen}"
                      class="badge bg-danger">
                    Verlopen
                </span>
                            <span th:unless="${vp.voorraad.houdbaarheid.isverlopen}"
                                  class="badge bg-success">
                    Geldig
                </span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>


            <a th:href="@{'/product/' + ${product.productcode} + '/stores'}"
               class="btn btn-dark btn-lg mt-3 px-4 py-2 rounded-3">
                Bekijk winkels & regio's
            </a>

        </div>
    </div>

</div>

</body>
</html>
